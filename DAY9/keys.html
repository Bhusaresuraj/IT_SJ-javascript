<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="name" placeholder="Enter your name" required  onkeyup="keyUp()" >
    <input type="text" id="name" placeholder="Enter your name" required  onkeydown="keyDown()" >



    <script>
        function keyDown()
        {
            alert("hello")
        }

        function keyUp()
        {
            alert("hii")
        }
    </script>
</body>
</html>
